<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Formes Universel</title>
    <!-- Główne biblioteki 3D -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <!-- Moduł do ładowania plików STL -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/STLLoader.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 40px;
            background-color: #f0f4f8;
            color: #2b343b;
            min-height: 100vh;
            box-sizing: border-box;
            align-items: center;
        }
        .main-app {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            max-width: 1400px;
        }
        .top-row {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            flex-wrap: nowrap;
        }
        @media (max-width: 1100px) {
            .top-row { flex-wrap: wrap; }
        }
        .bottom-row { width: 100%; }
        .controls {
            width: 360px; background: white; border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); overflow: hidden; flex-shrink: 0;
        }
        .tabs { display: flex; background: #eef1f6; border-bottom: 1px solid #ddd; }
        .tab {
            flex: 1; text-align: center; padding: 15px 0; font-size: 11px; font-weight: 700;
            cursor: pointer; text-transform: uppercase; color: #666; transition: 0.2s;
        }
        .tab.active { background: white; color: #005c91; border-bottom: 3px solid #005c91; }
        .tab-content { padding: 25px 30px; display: none; }
        .tab-content.active { display: block; }
        .global-settings { padding: 25px 30px; background: #fafafa; border-top: 1px solid #eee; }
        
        .preview-container { display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; }
        .preview-box {
            background: white; border-radius: 16px; padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); display: flex;
            flex-direction: column; align-items: center; width: 300px; box-sizing: border-box;
        }
        .preview-box span { font-size: 14px; font-weight: 600; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        #canvas3d, #canvas2d { 
            width: 260px; height: 260px; border-radius: 8px; background: #eef1f6; overflow: hidden; 
        }
        #canvas3d { cursor: grab; }
        #canvas3d:active { cursor: grabbing; }
        
        label { display: block; margin-top: 15px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #555; }
        input[type=range] { width: 100%; margin-top: 8px; cursor: pointer; accent-color: #0082c8; }
        .value-display { font-weight: 700; color: #0082c8; float: right; font-family: monospace; font-size: 14px; }
        
        .toggle-container { display: flex; align-items: center; gap: 12px; margin-top: 15px; cursor: pointer; }
        .toggle-container input { width: 18px; height: 18px; cursor: pointer; accent-color: #0082c8; margin:0; }
        .toggle-text { font-size: 12px; font-weight: 700; color: #2b343b; text-transform: uppercase; }
        
        .sub-slider-wrapper { display: none; padding-left: 30px; margin-bottom: 5px; }
        .sub-slider-wrapper label { margin-top: 5px; font-size: 10px; color: #777; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        button { flex: 1; padding: 14px; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s;}
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-svg { background: #005c91; }
        .btn-dxf { background: #0082c8; }

        .gallery-section {
            width: 100%; background: white; border-radius: 16px; padding: 30px; box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        }
        .gallery-title { text-align: center; font-size: 20px; font-weight: 700; margin-top: 0; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1.5px; color: #2b343b;}
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        @media (max-width: 800px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
        .preset-card {
            border: 1px solid #eee; border-radius: 12px; padding: 15px; cursor: pointer;
            transition: all 0.2s ease; background: #fff; text-align: center;
        }
        .preset-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0, 92, 145, 0.15); border-color: #005c91;}
        .preset-placeholder {
            height: 110px; background: #eef1f6; border-radius: 8px; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; padding: 5px; box-sizing: border-box;
        }
        .preset-placeholder img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s ease; }
        .preset-card:hover .preset-placeholder img { transform: scale(1.08); }
        .preset-name { font-weight: 700; font-size: 14px; color: #2b343b; text-transform: uppercase; }
        .preset-desc { font-size: 11px; color: #666; margin-top: 5px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="main-app">
        
        <div class="top-row">
            <!-- Aperçu 2D (Tylko 3D z góry) -->
            <div class="preview-container">
                <div class="preview-box">
                    <span>Aperçu 2D</span>
                    <div id="canvas2d"></div>
                </div>
            </div>

            <!-- Aperçu 3D -->
            <div class="preview-container">
                <div class="preview-box">
                    <span>Aperçu 3D</span>
                    <div id="canvas3d"></div>
                </div>
            </div>

            <!-- Panel kontrolny -->
            <div class="controls">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('poly')">Polygones</div>
                    <div class="tab" onclick="switchTab('rect')">Parallélogrammes</div>
                    <div class="tab" onclick="switchTab('ellipse')">Ellipses</div>
                </div>

                <div id="tab-poly" class="tab-content active">
                    <label>Diamètre [mm] <span class="value-display" id="val-dia">100</span>
                        <input type="range" id="dia" min="10" max="500" value="100">
                    </label>
                    <label>Nombre de côtés <span class="value-display" id="val-points">6</span>
                        <input type="range" id="points" min="3" max="20" value="6">
                    </label>
                    <label>Rayon interne <span class="value-display" id="val-inner">100%</span>
                        <input type="range" id="inner" min="10" max="100" value="100">
                    </label>
                    <label>Rayon de courbure <span class="value-display" id="val-corner">16</span>
                        <input type="range" id="corner" min="0" max="100" value="16">
                    </label>
                    <label class="toggle-container">
                        <input type="checkbox" id="polyStretchToggle">
                        <span class="toggle-text">Section interne</span>
                    </label>
                    <div id="polyStretchWrapper" style="display: none;">
                        <label>Longueur de la section [mm] <span class="value-display" id="val-polyStretch">50</span>
                            <input type="range" id="polyStretch" min="1" max="300" value="50">
                        </label>
                    </div>
                </div>

                <div id="tab-rect" class="tab-content">
                    <label>Largeur [mm] <span class="value-display" id="val-rectW">150</span>
                        <input type="range" id="rectW" min="10" max="500" value="150">
                    </label>
                    <label>Hauteur [mm] <span class="value-display" id="val-rectH">100</span>
                        <input type="range" id="rectH" min="10" max="500" value="100">
                    </label>
                    <label>Inclinaison [°] <span class="value-display" id="val-rectSkew">20</span>
                        <input type="range" id="rectSkew" min="0" max="45" value="20">
                    </label>
                    <label>Rayon de courbure par défaut <span class="value-display" id="val-rectCorner">10</span>
                        <input type="range" id="rectCorner" min="0" max="100" value="10">
                    </label>
                    
                    <div style="font-size: 10px; font-weight: bold; color: #888; margin-top: 25px; text-transform: uppercase;">Modifier les angles individuellement :</div>
                    
                    <label class="toggle-container">
                        <input type="checkbox" id="rectC1Toggle">
                        <span class="toggle-text">1 (Haut Droite)</span>
                    </label>
                    <div id="rectC1Wrapper" class="sub-slider-wrapper">
                        <label>Rayon angle 1 <span class="value-display" id="val-rectC1">0</span>
                            <input type="range" id="rectC1" min="0" max="100" value="0">
                        </label>
                    </div>

                    <label class="toggle-container">
                        <input type="checkbox" id="rectC2Toggle">
                        <span class="toggle-text">2 (Bas Droite)</span>
                    </label>
                    <div id="rectC2Wrapper" class="sub-slider-wrapper">
                        <label>Rayon angle 2 <span class="value-display" id="val-rectC2">0</span>
                            <input type="range" id="rectC2" min="0" max="100" value="0">
                        </label>
                    </div>

                    <label class="toggle-container">
                        <input type="checkbox" id="rectC3Toggle">
                        <span class="toggle-text">3 (Bas Gauche)</span>
                    </label>
                    <div id="rectC3Wrapper" class="sub-slider-wrapper">
                        <label>Rayon angle 3 <span class="value-display" id="val-rectC3">0</span>
                            <input type="range" id="rectC3" min="0" max="100" value="0">
                        </label>
                    </div>

                    <label class="toggle-container">
                        <input type="checkbox" id="rectC4Toggle">
                        <span class="toggle-text">4 (Haut Gauche)</span>
                    </label>
                    <div id="rectC4Wrapper" class="sub-slider-wrapper">
                        <label>Rayon angle 4 <span class="value-display" id="val-rectC4">0</span>
                            <input type="range" id="rectC4" min="0" max="100" value="0">
                        </label>
                    </div>
                </div>

                <div id="tab-ellipse" class="tab-content">
                    <label>Diamètre [mm] <span class="value-display" id="val-ellA">150</span>
                        <input type="range" id="ellA" min="10" max="500" value="150">
                    </label>
                    
                    <label class="toggle-container" style="margin-top: 25px;">
                        <input type="checkbox" id="ellModeToggle">
                        <span class="toggle-text">Mode Ellipse (axes différents)</span>
                    </label>
                    <div id="ellBWrapper" style="display: none; padding-left: 20px; border-left: 2px solid #eee; margin-left: 9px; margin-top: 10px;">
                        <label style="margin-top:0;">Diamètre Y [mm] <span class="value-display" id="val-ellB">100</span>
                            <input type="range" id="ellB" min="10" max="500" value="100">
                        </label>
                    </div>

                    <label class="toggle-container" style="margin-top: 25px;">
                        <input type="checkbox" id="ellStretchToggle">
                        <span class="toggle-text">Section interne (Pilule)</span>
                    </label>
                    <div id="ellStretchWrapper" style="display: none; padding-left: 20px; border-left: 2px solid #eee; margin-left: 9px; margin-top: 10px;">
                        <label style="margin-top:0;">Longueur de la section [mm] <span class="value-display" id="val-ellStretch">50</span>
                            <input type="range" id="ellStretch" min="1" max="300" value="50">
                        </label>
                    </div>
                </div>

                <div class="global-settings">
                    <label class="toggle-container">
                        <input type="checkbox" id="pixelToggle">
                        <span class="toggle-text">Mode Pixélisé</span>
                    </label>
                    <div id="pixelWrapper" style="display: none;">
                        <label>Taille de pixel [mm] <span class="value-display" id="val-pixel">8</span>
                            <input type="range" id="pixelSize" min="2" max="40" value="8">
                        </label>
                    </div>
                    
                    <label>Profondeur d'extrusion 3D [mm] <span class="value-display" id="val-thick">18</span>
                        <input type="range" id="thick" min="1" max="100" value="18">
                    </label>

                    <div class="btn-group">
                        <button class="btn-svg" onclick="downloadSVG()">Télécharger SVG</button>
                        <button class="btn-dxf" onclick="downloadDXF()">Télécharger DXF</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-row">
            <div class="gallery-section">
                <h3 class="gallery-title">Formes Classiques</h3>
                <div class="gallery-grid" id="presets-container"></div>
            </div>
        </div>
        
    </div>

    <script>
        let currentTab = 'poly';
        let currentDxfLines = [];
        let globalSvgStr = "";
        let globalBoundsLimit = 0;

        const recipes = {
            poly: [
                { name: "Coquille", desc: "Côtés: 10, Interne: 90%", params: { dia: 200, points: 10, inner: 90, corner: 40, polyStretchToggle: false, polyStretch: 50, pixelToggle: false } },
                { name: "Stella", desc: "Côtés: 4, Interne: 50%", params: { dia: 200, points: 4, inner: 50, corner: 40, polyStretchToggle: false, polyStretch: 50, pixelToggle: false } },
                { name: "Étoile", desc: "Côtés: 5, Interne: 70%", params: { dia: 200, points: 5, inner: 70, corner: 100, polyStretchToggle: false, polyStretch: 50, pixelToggle: false } },
                { name: "Écusson", desc: "Côtés: 6, Étiré", params: { dia: 150, points: 6, inner: 100, corner: 20, polyStretchToggle: true, polyStretch: 80, pixelToggle: false } },
                { name: "Soleil", desc: "Côtés: 12, Interne: 85%", params: { dia: 200, points: 12, inner: 85, corner: 10, polyStretchToggle: false, polyStretch: 50, pixelToggle: false } },
                { name: "Croix", desc: "Côtés: 4, Angles vifs", params: { dia: 200, points: 4, inner: 40, corner: 5, polyStretchToggle: false, polyStretch: 50, pixelToggle: false } }
            ],
            rect: [
                { name: "Losange Classique", desc: "Carré incliné", params: { rectW: 150, rectH: 150, rectSkew: 25, rectCorner: 5, rectC1Toggle: false, rectC2Toggle: false, rectC3Toggle: false, rectC4Toggle: false, pixelToggle: false } },
                { name: "Marque-page", desc: "Haut arrondi", params: { rectW: 120, rectH: 220, rectSkew: 0, rectCorner: 0, rectC1Toggle: true, rectC1: 60, rectC4Toggle: true, rectC4: 60, rectC2Toggle: false, rectC3Toggle: false, pixelToggle: false } },
                { name: "Feuille", desc: "2 angles opposés arrondis", params: { rectW: 160, rectH: 160, rectSkew: 0, rectCorner: 0, rectC1Toggle: true, rectC1: 150, rectC3Toggle: true, rectC3: 150, rectC2Toggle: false, rectC4Toggle: false, pixelToggle: false } },
                { name: "Capsule", desc: "Entièrement arrondi", params: { rectW: 250, rectH: 80, rectSkew: 0, rectCorner: 100, rectC1Toggle: false, rectC2Toggle: false, rectC3Toggle: false, rectC4Toggle: false, pixelToggle: false } },
                { name: "Fanion", desc: "Incliné & doux", params: { rectW: 220, rectH: 100, rectSkew: 25, rectCorner: 20, rectC1Toggle: false, rectC2Toggle: false, rectC3Toggle: false, rectC4Toggle: false, pixelToggle: false } },
                { name: "Goutte", desc: "Un angle vif en bas", params: { rectW: 150, rectH: 150, rectSkew: 0, rectCorner: 100, rectC2Toggle: true, rectC2: 0, rectC1Toggle: false, rectC3Toggle: false, rectC4Toggle: false, pixelToggle: false } }
            ],
            ellipse: [
                { name: "Cercle Parfait", desc: "Cercle standard", params: { ellA: 200, ellModeToggle: false, ellStretchToggle: false, pixelToggle: false } },
                { name: "Ovale Classique", desc: "Mode ellipse actif", params: { ellA: 240, ellB: 120, ellModeToggle: true, ellStretchToggle: false, pixelToggle: false } },
                { name: "Pilule", desc: "Cercle étiré", params: { ellA: 100, ellModeToggle: false, ellStretchToggle: true, ellStretch: 150, pixelToggle: false } },
                { name: "Bande Fine", desc: "Ellipse très étroite", params: { ellA: 280, ellB: 40, ellModeToggle: true, ellStretchToggle: false, pixelToggle: false } },
                { name: "Haricot", desc: "Pilule aplatie", params: { ellA: 80, ellB: 140, ellModeToggle: true, ellStretchToggle: true, ellStretch: 120, pixelToggle: false } },
                { name: "Pièce", desc: "Dimensions standard", params: { ellA: 180, ellModeToggle: false, ellStretchToggle: false, pixelToggle: false } }
            ]
        };

        const inputs = {
            dia: document.getElementById('dia'), points: document.getElementById('points'), inner: document.getElementById('inner'), corner: document.getElementById('corner'),
            polyStretchToggle: document.getElementById('polyStretchToggle'), polyStretch: document.getElementById('polyStretch'),
            rectW: document.getElementById('rectW'), rectH: document.getElementById('rectH'), rectSkew: document.getElementById('rectSkew'), rectCorner: document.getElementById('rectCorner'),
            rectC1Toggle: document.getElementById('rectC1Toggle'), rectC1: document.getElementById('rectC1'),
            rectC2Toggle: document.getElementById('rectC2Toggle'), rectC2: document.getElementById('rectC2'),
            rectC3Toggle: document.getElementById('rectC3Toggle'), rectC3: document.getElementById('rectC3'),
            rectC4Toggle: document.getElementById('rectC4Toggle'), rectC4: document.getElementById('rectC4'),
            ellA: document.getElementById('ellA'), ellB: document.getElementById('ellB'),
            ellModeToggle: document.getElementById('ellModeToggle'), ellStretchToggle: document.getElementById('ellStretchToggle'), ellStretch: document.getElementById('ellStretch'),
            thick: document.getElementById('thick'), pixelToggle: document.getElementById('pixelToggle'), pixelSize: document.getElementById('pixelSize')
        };
        
        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
            renderGallery();
            update();
        }

        // --- KONFIGURACJA WSPÓLNA DLA THREE.JS ---
        const material3D = new THREE.MeshStandardMaterial({ color: 0x2b343b, roughness: 0.7, metalness: 0.2 });
        
        // 1. SCENA 3D (Interaktywna)
        const container3D = document.getElementById('canvas3d');
        const scene3D = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
        camera3D.position.set(0, -350, 350);
        
        const renderer3D = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer3D.setSize(260, 260); renderer3D.setPixelRatio(window.devicePixelRatio);
        container3D.appendChild(renderer3D.domElement);
        
        const controls = new THREE.OrbitControls(camera3D, renderer3D.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        
        scene3D.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight3D_1 = new THREE.DirectionalLight(0xffffff, 0.6); dirLight3D_1.position.set(50, 100, 200); scene3D.add(dirLight3D_1);
        const dirLight3D_2 = new THREE.DirectionalLight(0xffffff, 0.3); dirLight3D_2.position.set(-50, -100, -200); scene3D.add(dirLight3D_2);
        
        const modelGroup3D = new THREE.Group(); scene3D.add(modelGroup3D);

        // 2. SCENA 2D (Stały widok z góry)
        const container2D = document.getElementById('canvas2d');
        const scene2D = new THREE.Scene();
        const camera2D = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
        
        const renderer2D = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer2D.setSize(260, 260); renderer2D.setPixelRatio(window.devicePixelRatio);
        container2D.appendChild(renderer2D.domElement);
        
        scene2D.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight2D_1 = new THREE.DirectionalLight(0xffffff, 0.6); dirLight2D_1.position.set(50, 100, 200); scene2D.add(dirLight2D_1);
        const dirLight2D_2 = new THREE.DirectionalLight(0xffffff, 0.3); dirLight2D_2.position.set(-50, -100, -200); scene2D.add(dirLight2D_2);
        
        const modelGroup2D = new THREE.Group(); scene2D.add(modelGroup2D);

        // 3. SCENA DLA MINIATUREK (Niewidoczna w DOM, wykorzystywana do generowania DataURL)
        const thumbRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        thumbRenderer.setSize(120, 120); thumbRenderer.setPixelRatio(window.devicePixelRatio);
        const thumbScene = new THREE.Scene();
        const thumbCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
        thumbScene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const thumbLight_1 = new THREE.DirectionalLight(0xffffff, 0.6); thumbLight_1.position.set(50, 100, 200); thumbScene.add(thumbLight_1);
        const thumbLight_2 = new THREE.DirectionalLight(0xffffff, 0.3); thumbLight_2.position.set(-50, -100, -200); thumbScene.add(thumbLight_2);

        // --- ZMIENNE MESHÓW ---
        let currentMesh3D = null;
        let currentMesh2D = null;
        let stlMesh3D = null;
        let stlMesh2D = null;

        // ŁADOWANIE MODELU UCHWYTU STL
        const stlLoader = new THREE.STLLoader();
        stlLoader.load('hanging-system.stl', function (geometry) {
            const stlMaterial = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.4, metalness: 0.6 });
            
            stlMesh3D = new THREE.Mesh(geometry, stlMaterial);
            stlMesh3D.rotation.x = Math.PI;
            modelGroup3D.add(stlMesh3D);
            
            stlMesh2D = new THREE.Mesh(geometry, stlMaterial);
            stlMesh2D.rotation.x = Math.PI;
            modelGroup2D.add(stlMesh2D);
            
            update();
        }, undefined, function (error) {
            console.warn('Uwaga: Plik hanging-system.stl nie został załadowany (prawdopodobnie brak pliku lub blokada CORS przeglądarki).', error);
        });

        // GŁÓWNY SILNIK GENERACJI Z GEOMETRII 
        function generateShapeData(tab, rawParams = null) {
            const p = {
                dia: rawParams?.dia !== undefined ? rawParams.dia : parseFloat(inputs.dia.value),
                points: rawParams?.points !== undefined ? rawParams.points : parseInt(inputs.points.value),
                inner: rawParams?.inner !== undefined ? rawParams.inner : parseInt(inputs.inner.value),
                corner: rawParams?.corner !== undefined ? rawParams.corner : parseFloat(inputs.corner.value),
                polyStretchToggle: rawParams?.polyStretchToggle !== undefined ? rawParams.polyStretchToggle : inputs.polyStretchToggle.checked,
                polyStretch: rawParams?.polyStretch !== undefined ? rawParams.polyStretch : parseFloat(inputs.polyStretch.value),
                
                rectW: rawParams?.rectW !== undefined ? rawParams.rectW : parseFloat(inputs.rectW.value),
                rectH: rawParams?.rectH !== undefined ? rawParams.rectH : parseFloat(inputs.rectH.value),
                rectSkew: rawParams?.rectSkew !== undefined ? rawParams.rectSkew : parseFloat(inputs.rectSkew.value),
                rectCorner: rawParams?.rectCorner !== undefined ? rawParams.rectCorner : parseFloat(inputs.rectCorner.value),
                rectC1Toggle: rawParams?.rectC1Toggle !== undefined ? rawParams.rectC1Toggle : inputs.rectC1Toggle.checked,
                rectC1: rawParams?.rectC1 !== undefined ? rawParams.rectC1 : parseFloat(inputs.rectC1.value),
                rectC2Toggle: rawParams?.rectC2Toggle !== undefined ? rawParams.rectC2Toggle : inputs.rectC2Toggle.checked,
                rectC2: rawParams?.rectC2 !== undefined ? rawParams.rectC2 : parseFloat(inputs.rectC2.value),
                rectC3Toggle: rawParams?.rectC3Toggle !== undefined ? rawParams.rectC3Toggle : inputs.rectC3Toggle.checked,
                rectC3: rawParams?.rectC3 !== undefined ? rawParams.rectC3 : parseFloat(inputs.rectC3.value),
                rectC4Toggle: rawParams?.rectC4Toggle !== undefined ? rawParams.rectC4Toggle : inputs.rectC4Toggle.checked,
                rectC4: rawParams?.rectC4 !== undefined ? rawParams.rectC4 : parseFloat(inputs.rectC4.value),
                
                ellA: rawParams?.ellA !== undefined ? rawParams.ellA : parseFloat(inputs.ellA.value),
                ellB: rawParams?.ellB !== undefined ? rawParams.ellB : parseFloat(inputs.ellB.value),
                ellModeToggle: rawParams?.ellModeToggle !== undefined ? rawParams.ellModeToggle : inputs.ellModeToggle.checked,
                ellStretchToggle: rawParams?.ellStretchToggle !== undefined ? rawParams.ellStretchToggle : inputs.ellStretchToggle.checked,
                ellStretch: rawParams?.ellStretch !== undefined ? rawParams.ellStretch : parseFloat(inputs.ellStretch.value),
                
                thick: rawParams?.thick !== undefined ? rawParams.thick : parseFloat(inputs.thick.value),
                pixelToggle: rawParams?.pixelToggle !== undefined ? rawParams.pixelToggle : inputs.pixelToggle.checked,
                pixelSize: rawParams?.pixelSize !== undefined ? rawParams.pixelSize : parseFloat(inputs.pixelSize.value)
            };

            let rawPoints = [];
            let bLimit = 0;
            
            if (tab === 'poly') {
                let inRadius = (p.dia / 2) * ((p.inner * 0.95) / 100);
                let stretch = p.polyStretchToggle ? p.polyStretch : 0;
                bLimit = p.dia + stretch;
                let angleStep = Math.PI / p.points;
                for (let i = 0; i < 2 * p.points; i++) {
                    let r = (i % 2 === 0) ? p.dia / 2 : inRadius;
                    let a = -Math.PI / 2 + i * angleStep;
                    let x = Math.cos(a) * r; let y = Math.sin(a) * r;
                    if (stretch > 0) {
                        if (Math.abs(x) < 1e-5) {
                            if (y < 0) { rawPoints.push({x: x - stretch/2, y, r: p.corner}, {x: x + stretch/2, y, r: p.corner}); } 
                            else { rawPoints.push({x: x + stretch/2, y, r: p.corner}, {x: x - stretch/2, y, r: p.corner}); }
                        } else if (x > 0) rawPoints.push({x: x + stretch/2, y, r: p.corner});
                        else rawPoints.push({x: x - stretch/2, y, r: p.corner});
                    } else rawPoints.push({x, y, r: p.corner});
                }
            } else if (tab === 'rect') {
                let r1 = p.rectC1Toggle ? p.rectC1 : p.rectCorner;
                let r2 = p.rectC2Toggle ? p.rectC2 : p.rectCorner;
                let r3 = p.rectC3Toggle ? p.rectC3 : p.rectCorner;
                let r4 = p.rectC4Toggle ? p.rectC4 : p.rectCorner;
                bLimit = Math.max(p.rectW, p.rectH) * 1.5;
                let skewOffset = (p.rectH / 2) * Math.tan(p.rectSkew * Math.PI / 180);
                rawPoints = [
                    { x: p.rectW/2 + skewOffset, y: -p.rectH/2, r: r1 },
                    { x: p.rectW/2 - skewOffset, y: p.rectH/2, r: r2 },
                    { x: -p.rectW/2 - skewOffset, y: p.rectH/2, r: r3 },
                    { x: -p.rectW/2 + skewOffset, y: -p.rectH/2, r: r4 }
                ];
            } else if (tab === 'ellipse') {
                let rx = p.ellA / 2;
                let ry = p.ellModeToggle ? p.ellB / 2 : rx; 
                let stretch = p.ellStretchToggle ? p.ellStretch : 0;
                bLimit = (Math.max(rx, ry) * 2) + stretch;
                let segments = 64; 
                if (stretch > 0) {
                    for(let i=0; i<=segments/2; i++) {
                        let a = -Math.PI/2 + (i / (segments/2)) * Math.PI;
                        rawPoints.push({ x: stretch/2 + rx * Math.cos(a), y: ry * Math.sin(a), r: 0 });
                    }
                    for(let i=0; i<=segments/2; i++) {
                        let a = Math.PI/2 + (i / (segments/2)) * Math.PI;
                        rawPoints.push({ x: -stretch/2 + rx * Math.cos(a), y: ry * Math.sin(a), r: 0 });
                    }
                } else {
                    for(let i=0; i<segments; i++) {
                        let a = -Math.PI/2 + (i / segments) * 2 * Math.PI;
                        rawPoints.push({ x: rx * Math.cos(a), y: ry * Math.sin(a), r: 0 });
                    }
                }
            }

            let svgStr = "";
            let dxfLines = [];
            let len = rawPoints.length;
            let lastDxfPoint = null, firstDxfPoint = null;
            
            for (let i = 0; i < len; i++) {
                let p0 = rawPoints[(i - 1 + len) % len];
                let p1 = rawPoints[i];
                let p2 = rawPoints[(i + 1) % len];
                
                let dx1 = p0.x - p1.x; let dy1 = p0.y - p1.y;
                let dx2 = p2.x - p1.x; let dy2 = p2.y - p1.y;
                let len1 = Math.hypot(dx1, dy1), len2 = Math.hypot(dx2, dy2);
                if (len1 < 0.001 || len2 < 0.001) continue; 
                
                let a1 = Math.atan2(dy1, dx1), a2 = Math.atan2(dy2, dx2);
                let angle = Math.abs(a1 - a2); if (angle > Math.PI) angle = 2 * Math.PI - angle;
                
                let ptRadius = p1.r !== undefined ? p1.r : 0;
                let d = ptRadius / Math.tan(angle / 2);
                d = Math.min(d, len1 / 2.05, len2 / 2.05); 
                
                let r_actual = d * Math.tan(angle / 2); 
                if (isNaN(r_actual) || r_actual < 0.001) r_actual = 0;
                
                let t1x = p1.x + (dx1 / len1) * (r_actual > 0 ? d : 0); 
                let t1y = p1.y + (dy1 / len1) * (r_actual > 0 ? d : 0);
                let t2x = p1.x + (dx2 / len2) * (r_actual > 0 ? d : 0); 
                let t2y = p1.y + (dy2 / len2) * (r_actual > 0 ? d : 0);
                
                let sweepFlag = (dx1 * dy2 - dy1 * dx2) <= 0 ? 1 : 0; 
                
                if (svgStr === "") svgStr += `M ${t1x} ${t1y} `; else svgStr += `L ${t1x} ${t1y} `;
                if (r_actual > 0) svgStr += `A ${r_actual} ${r_actual} 0 0 ${sweepFlag} ${t2x} ${t2y} `; else svgStr += `L ${t2x} ${t2y} `;

                if (lastDxfPoint) dxfLines.push({x1: lastDxfPoint.x, y1: lastDxfPoint.y, x2: t1x, y2: t1y});
                else firstDxfPoint = {x: t1x, y: t1y};

                if (r_actual > 0) {
                    let nx = -dy1 / len1, ny = dx1 / len1;
                    let cx1 = t1x + nx * r_actual, cy1 = t1y + ny * r_actual;
                    let cx2 = t1x - nx * r_actual, cy2 = t1y - ny * r_actual;
                    let dist1 = Math.hypot(t2x - cx1, t2y - cy1), dist2 = Math.hypot(t2x - cx2, t2y - cy2);
                    let arcCx = Math.abs(dist1 - r_actual) < Math.abs(dist2 - r_actual) ? cx1 : cx2;
                    let arcCy = Math.abs(dist1 - r_actual) < Math.abs(dist2 - r_actual) ? cy1 : cy2;
                    
                    let ang1 = Math.atan2(t1y - arcCy, t1x - arcCx), ang2 = Math.atan2(t2y - arcCy, t2x - arcCx);
                    let delta = ang2 - ang1; while(delta > Math.PI) delta -= 2*Math.PI; while(delta < -Math.PI) delta += 2*Math.PI;
                    
                    let segmentsCount = Math.max(8, Math.ceil(r_actual * Math.abs(delta) * 2));
                    let prevPt = {x: t1x, y: t1y};
                    for(let j = 1; j <= segmentsCount; j++) {
                        let pt = { x: arcCx + r_actual * Math.cos(ang1 + delta * (j/segmentsCount)), y: arcCy + r_actual * Math.sin(ang1 + delta * (j/segmentsCount)) };
                        dxfLines.push({x1: prevPt.x, y1: prevPt.y, x2: pt.x, y2: pt.y});
                        prevPt = pt;
                    }
                    lastDxfPoint = {x: t2x, y: t2y};
                } else lastDxfPoint = {x: t2x, y: t2y};
            }
            if (lastDxfPoint && firstDxfPoint) dxfLines.push({x1: lastDxfPoint.x, y1: lastDxfPoint.y, x2: firstDxfPoint.x, y2: firstDxfPoint.y});
            svgStr += "Z";

            if (p.pixelToggle) {
                let pSize = p.pixelSize;
                const tempCanvas = document.createElement('canvas'); const tempCtx = tempCanvas.getContext('2d');
                const p2d = new Path2D(svgStr);
                let solidCells = new Set();
                let gridMin = Math.floor(-bLimit / pSize) - 2, gridMax = Math.ceil(bLimit / pSize) + 2;
                
                for (let x = gridMin; x <= gridMax; x++) {
                    for (let y = gridMin; y <= gridMax; y++) {
                        if (tempCtx.isPointInPath(p2d, (x + 0.5) * pSize, (y + 0.5) * pSize)) solidCells.add(`${x},${y}`);
                    }
                }
                
                let edges = [];
                for (let cell of solidCells) {
                    let [x, y] = cell.split(',').map(Number);
                    if (!solidCells.has(`${x},${y-1}`)) edges.push({x1: x, y1: y, x2: x+1, y2: y});
                    if (!solidCells.has(`${x+1},${y}`)) edges.push({x1: x+1, y1: y, x2: x+1, y2: y+1});
                    if (!solidCells.has(`${x},${y+1}`)) edges.push({x1: x+1, y1: y+1, x2: x, y2: y+1});
                    if (!solidCells.has(`${x-1},${y}`)) edges.push({x1: x, y1: y+1, x2: x, y2: y});
                }

                let loops = [];
                while(edges.length > 0) {
                    let current = edges.pop(); let loop = [ {x: current.x1, y: current.y1}, {x: current.x2, y: current.y2} ];
                    let sanity = 10000;
                    while(sanity-- > 0) {
                        let nextIdx = edges.findIndex(e => e.x1 === loop[loop.length-1].x && e.y1 === loop[loop.length-1].y);
                        if (nextIdx !== -1) {
                            let nextEdge = edges.splice(nextIdx, 1)[0];
                            if (nextEdge.x2 === loop[0].x && nextEdge.y2 === loop[0].y) break;
                            loop.push({x: nextEdge.x2, y: nextEdge.y2});
                        } else break;
                    }
                    loops.push(loop);
                }
                
                if (loops.length > 1) loops.sort((a, b) => b.length - a.length);
                svgStr = ""; dxfLines = [];
                if (loops.length > 0) {
                    let loop = loops[0];
                    let startX = loop[0].x * pSize, startY = loop[0].y * pSize;
                    svgStr += `M ${startX} ${startY} `;
                    for (let i = 1; i < loop.length; i++) {
                        let x = loop[i].x * pSize, y = loop[i].y * pSize;
                        svgStr += `L ${x} ${y} `;
                        dxfLines.push({x1: loop[i-1].x * pSize, y1: loop[i-1].y * pSize, x2: x, y2: y});
                    }
                    svgStr += "Z";
                    dxfLines.push({x1: loop[loop.length - 1].x * pSize, y1: loop[loop.length - 1].y * pSize, x2: startX, y2: startY});
                }
            }

            let geometry = null;
            if (dxfLines.length > 0) {
                const shape = new THREE.Shape();
                shape.moveTo(dxfLines[0].x1, -dxfLines[0].y1);
                for(let i=0; i<dxfLines.length; i++) shape.lineTo(dxfLines[i].x2, -dxfLines[i].y2);
                
                geometry = new THREE.ExtrudeGeometry(shape, { depth: p.thick, bevelEnabled: false });
                geometry.computeBoundingBox(); 
                geometry.translate(-geometry.boundingBox.getCenter(new THREE.Vector3()).x, -geometry.boundingBox.getCenter(new THREE.Vector3()).y, -p.thick / 2);
            }

            return { geometry, dxfLines, svgStr, bLimit, thick: p.thick };
        }

        // --- RENDEROWANIE ZDJĘĆ MINIATUREK (FORMES CLASSIQUES) ---
        function generateThumbnailURL(tab, params) {
            // Wyczyść starą geometrię z miniatury
            const meshes = thumbScene.children.filter(c => c.isMesh);
            meshes.forEach(m => { m.geometry.dispose(); thumbScene.remove(m); });

            let data = generateShapeData(tab, params);
            if (data.geometry) {
                let mesh = new THREE.Mesh(data.geometry, material3D);
                thumbScene.add(mesh);
                
                // Dostosuj kamerę miniatury, aby kształt był w całości widoczny
                let fitZ = (data.bLimit / 2) / Math.tan(Math.PI * 45 / 360) * 1.5;
                thumbCamera.position.set(0, 0, Math.max(fitZ, 150));
                thumbCamera.lookAt(0, 0, 0);
                
                thumbRenderer.render(thumbScene, thumbCamera);
                return thumbRenderer.domElement.toDataURL('image/png');
            }
            return '';
        }

        function renderGallery() {
            const container = document.getElementById('presets-container');
            container.innerHTML = '';
            recipes[currentTab].forEach((recipe) => {
                const card = document.createElement('div');
                card.className = 'preset-card';
                card.onclick = () => applyRecipe(recipe.params);
                
                let imgDataUrl = generateThumbnailURL(currentTab, recipe.params);
                
                card.innerHTML = `
                    <div class="preset-placeholder">
                        <img src="${imgDataUrl}" alt="${recipe.name}" />
                    </div>
                    <div class="preset-name">${recipe.name}</div>
                    <div class="preset-desc">${recipe.desc}</div>
                `;
                container.appendChild(card);
            });
        }

        function applyRecipe(params) {
            for (let key in params) {
                if (inputs[key]) {
                    if (inputs[key].type === 'checkbox') inputs[key].checked = params[key];
                    else inputs[key].value = params[key];
                }
            }
            refreshToggles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            update();
        }

        function refreshToggles() {
            let polyStretchChecked = inputs.polyStretchToggle.checked;
            document.getElementById('polyStretchWrapper').style.display = polyStretchChecked ? 'block' : 'none';
            
            if (polyStretchChecked) {
                inputs.points.min = "4"; inputs.points.step = "2";
                if (parseInt(inputs.points.value) % 2 !== 0) inputs.points.value = parseInt(inputs.points.value) + 1;
            } else {
                inputs.points.min = "3"; inputs.points.step = "1";
            }

            document.getElementById('rectC1Wrapper').style.display = inputs.rectC1Toggle.checked ? 'block' : 'none';
            document.getElementById('rectC2Wrapper').style.display = inputs.rectC2Toggle.checked ? 'block' : 'none';
            document.getElementById('rectC3Wrapper').style.display = inputs.rectC3Toggle.checked ? 'block' : 'none';
            document.getElementById('rectC4Wrapper').style.display = inputs.rectC4Toggle.checked ? 'block' : 'none';
            document.getElementById('ellBWrapper').style.display = inputs.ellModeToggle.checked ? 'block' : 'none';
            document.getElementById('ellStretchWrapper').style.display = inputs.ellStretchToggle.checked ? 'block' : 'none';
            document.getElementById('pixelWrapper').style.display = inputs.pixelToggle.checked ? 'block' : 'none';
        }

        ['polyStretchToggle', 'rectC1Toggle', 'rectC2Toggle', 'rectC3Toggle', 'rectC4Toggle', 'ellModeToggle', 'ellStretchToggle', 'pixelToggle'].forEach(id => {
            inputs[id].addEventListener('change', () => { refreshToggles(); update(); });
        });

        function animate() { 
            requestAnimationFrame(animate); 
            controls.update(); 
            renderer3D.render(scene3D, camera3D); 
            renderer2D.render(scene2D, camera2D); 
        }
        animate();

        function update() {
            document.getElementById('val-dia').textContent = inputs.dia.value;
            document.getElementById('val-points').textContent = inputs.points.value;
            document.getElementById('val-inner').textContent = inputs.inner.value + '%';
            document.getElementById('val-corner').textContent = inputs.corner.value;
            document.getElementById('val-polyStretch').textContent = inputs.polyStretch.value;
            
            document.getElementById('val-rectW').textContent = inputs.rectW.value;
            document.getElementById('val-rectH').textContent = inputs.rectH.value;
            document.getElementById('val-rectSkew').textContent = inputs.rectSkew.value;
            document.getElementById('val-rectCorner').textContent = inputs.rectCorner.value;
            document.getElementById('val-rectC1').textContent = inputs.rectC1.value;
            document.getElementById('val-rectC2').textContent = inputs.rectC2.value;
            document.getElementById('val-rectC3').textContent = inputs.rectC3.value;
            document.getElementById('val-rectC4').textContent = inputs.rectC4.value;
            
            document.getElementById('val-ellA').textContent = inputs.ellA.value;
            document.getElementById('val-ellB').textContent = inputs.ellB.value;
            document.getElementById('val-ellStretch').textContent = inputs.ellStretch.value;
            
            document.getElementById('val-thick').textContent = inputs.thick.value;
            document.getElementById('val-pixel').textContent = inputs.pixelSize.value;

            // Wygeneruj nową geometrię
            let data = generateShapeData(currentTab);
            currentDxfLines = data.dxfLines;
            globalSvgStr = data.svgStr;
            globalBoundsLimit = data.bLimit;

            // Aktualizacja 3D (obracane)
            if (currentMesh3D) { modelGroup3D.remove(currentMesh3D); currentMesh3D.geometry.dispose(); }
            // Aktualizacja 2D (zamrożone z góry)
            if (currentMesh2D) { modelGroup2D.remove(currentMesh2D); currentMesh2D.geometry.dispose(); }

            if (data.geometry) {
                currentMesh3D = new THREE.Mesh(data.geometry, material3D); 
                modelGroup3D.add(currentMesh3D);
                
                currentMesh2D = new THREE.Mesh(data.geometry, material3D); 
                modelGroup2D.add(currentMesh2D);
                
                // Dostosuj uchwyt (jeżeli został poprawnie pobrany i wgrany wcześnie)
                if (stlMesh3D) stlMesh3D.position.z = -data.thick / 2;
                if (stlMesh2D) stlMesh2D.position.z = -data.thick / 2;

                // Dopasowanie stałej kamery dla widoku 2D, by mieściła kształt na ekranie
                let fitZ = (data.bLimit / 2) / Math.tan(Math.PI * 45 / 360) * 1.5;
                camera2D.position.set(0, 0, Math.max(fitZ, 250));
                camera2D.lookAt(0, 0, 0);
            }
        }

        // Zmodyfikowana funkcja generująca tekstowy plik SVG bezpośrednio, bo sam element zniknął ze strony
        function downloadSVG() { 
            let pad = 20;
            let vb = `${-(globalBoundsLimit/2) - pad} ${-(globalBoundsLimit/2) - pad} ${globalBoundsLimit + pad*2} ${globalBoundsLimit + pad*2}`;
            let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}"><path d="${globalSvgStr}" fill="#005c91" /></svg>`;
            triggerDownload(svgContent, "forme.svg", "image/svg+xml"); 
        }

        function downloadDXF() {
            let dxf = "  0\nSECTION\n  2\nENTITIES\n";
            currentDxfLines.forEach(l => { dxf += `  0\nLINE\n  8\n0\n 10\n${l.x1.toFixed(4)}\n 20\n${(-l.y1).toFixed(4)}\n 30\n0.0\n 11\n${l.x2.toFixed(4)}\n 21\n${(-l.y2).toFixed(4)}\n 31\n0.0\n`; });
            dxf += "  0\nENDSEC\n  0\nEOF\n";
            triggerDownload(dxf, "forme.dxf", "application/dxf");
        }

        function triggerDownload(content, filename, type) {
            const blob = new Blob([content], { type: type + ";charset=utf-8" });
            const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.href = url; link.download = filename;
            document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
        }

        Object.values(inputs).forEach(input => input.addEventListener('input', update));
        
        renderGallery();
        update();
    </script>
</body>
